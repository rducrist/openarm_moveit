# Motor gains for the SagresOverdose OpenArm v1.0 (used by urdf/sagres_openarm_v10.urdf.xacro).
# Sent to each Damiao motor's MIT controller: torque = kp * (q_cmd - q) + kd * (dq_cmd - dq).
#   kp: stiffness [Nm/rad]  -> higher = tracks position more tightly, less sag under gravity
#   kd: damping [Nm*s/rad]  -> raise together with kp to avoid oscillation
# Based on upstream openarm_description v1.0 config/arm/control_gains.yaml.
# joint1-4 raised ~1.5x kp / ~1.22x kd (sqrt 1.5) on 2026-10-17: the left arm sagged
# 3.7 deg on joint1 at rest (4.4 Nm / kp 70). Upstream: kp 70/70/70/60, kd 2.75/2.5/2.0/2.0.
# Note: one file for both arms (both ros2_control blocks read it).
# Rebuild (pixi run build) and relaunch after editing.
joint1:
  kp: 105.0
  kd: 3.35

joint2:
  kp: 105.0
  kd: 3.05

joint3:
  kp: 105.0
  kd: 2.45

joint4:
  kp: 90.0
  kd: 2.45

joint5:
  kp: 10.0
  kd: 0.7

joint6:
  kp: 10.0
  kd: 0.6

joint7:
  kp: 10.0
  kd: 0.5

hand:
  kp: 5.0
  kd: 0.1
