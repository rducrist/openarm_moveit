# MoveIt joint limits (override the URDF). The upstream URDF allows up to ~21 rad/s, which is
# far too fast for first tests on hardware, so velocities are capped here. Pilz and time
# parameterization need acceleration limits, which the URDF does not provide.
default_velocity_scaling_factor: 0.2
default_acceleration_scaling_factor: 0.2

joint_limits:
  openarm_left_joint1:
    has_velocity_limits: true
    max_velocity: 2.0
    has_acceleration_limits: true
    max_acceleration: 4.0
