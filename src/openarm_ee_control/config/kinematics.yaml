# TRAC-IK: KDL's solver fails even on small steps for this 7-DOF arm (tight joint-4 limits),
# which breaks Cartesian paths. "Distance" picks the solution closest to the seed state.
left_arm:
  kinematics_solver: trac_ik_kinematics_plugin/TRAC_IKKinematicsPlugin
  kinematics_solver_timeout: 0.05
  solve_type: Distance
right_arm:
  kinematics_solver: trac_ik_kinematics_plugin/TRAC_IKKinematicsPlugin
  kinematics_solver_timeout: 0.05
  solve_type: Distance
