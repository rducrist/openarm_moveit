# ros2_control controllers for bimanual OpenArm.
controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    left_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    right_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    left_gripper_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    right_gripper_controller:
      type: joint_trajectory_controller/JointTrajectoryController

left_arm_controller:
  ros__parameters:
    joints: [openarm_left_joint1, openarm_left_joint2, openarm_left_joint3, openarm_left_joint4, openarm_left_joint5, openarm_left_joint6, openarm_left_joint7]
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    state_publish_rate: 50.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    open_loop_control: false
    constraints:
      stopped_velocity_tolerance: 0.05
      goal_time: 1.0
      openarm_left_joint1: {trajectory: 0.2, goal: 0.02}
      openarm_left_joint2: {trajectory: 0.2, goal: 0.02}
      openarm_left_joint3: {trajectory: 0.2, goal: 0.02}
      openarm_left_joint4: {trajectory: 0.2, goal: 0.02}
      openarm_left_joint5: {trajectory: 0.2, goal: 0.02}
      openarm_left_joint6: {trajectory: 0.2, goal: 0.02}
      openarm_left_joint7: {trajectory: 0.2, goal: 0.02}

right_arm_controller:
  ros__parameters:
    joints: [openarm_right_joint1, openarm_right_joint2, openarm_right_joint3, openarm_right_joint4, openarm_right_joint5, openarm_right_joint6, openarm_right_joint7]
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    state_publish_rate: 50.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    open_loop_control: false
    constraints:
      stopped_velocity_tolerance: 0.05
      goal_time: 1.0
      openarm_right_joint1: {trajectory: 0.2, goal: 0.02}
      openarm_right_joint2: {trajectory: 0.2, goal: 0.02}
      openarm_right_joint3: {trajectory: 0.2, goal: 0.02}
      openarm_right_joint4: {trajectory: 0.2, goal: 0.02}
      openarm_right_joint5: {trajectory: 0.2, goal: 0.02}
      openarm_right_joint6: {trajectory: 0.2, goal: 0.02}
      openarm_right_joint7: {trajectory: 0.2, goal: 0.02}

left_gripper_controller:
  ros__parameters:
    joints: [openarm_left_finger_joint1]
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    allow_partial_joints_goal: false
    constraints:
      stopped_velocity_tolerance: 0.05
      goal_time: 1.0

right_gripper_controller:
  ros__parameters:
    joints: [openarm_right_finger_joint1]
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    allow_partial_joints_goal: false
    constraints:
      stopped_velocity_tolerance: 0.05
      goal_time: 1.0
